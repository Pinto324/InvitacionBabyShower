<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Baby Shower Elena Amelie</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
        <link rel="stylesheet" href="main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    </head>
    <body class="bg-light w-100">
        <!-- REPRODUCTOR DE MÚSICA Y BOTÓN FLOTANTE (NUEVO) -->
        <!-- NOTA: Cambia "musica.mp3" por el nombre de tu archivo de canción -->
        <audio id="musica-fondo" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
        <button id="btn-musica" class="btn-musica-flotante">
            <!-- SVG de Sonido Activo -->
            <svg id="svg-sonido" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
              <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
              <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
              <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
            </svg>
            <!-- SVG de Sonido Muteado (Oculto por defecto) -->
            <svg id="svg-mute" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 16 16" style="display: none;">
              <path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06zm7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0z"/>
            </svg>
        </button>
        <!-- Sección de Inicio (Portada) -->
        <section id="inicio" class="seccion-inicio">
            <!-- Cortinas con textura -->
            <div class="puerta puerta-izq"></div>
            <div class="puerta puerta-der"></div>
            
            <div class="contenido-inicio">
                <h1>Estás Invitado</h1>
                <h2>Baby Shower</h2>
                <button id="btn-abrir">Abrir Invitación</button>
            </div>
        </section>

        <!-- SECCIÓN 2: Detalles del Evento (Con la clase efecto-blur inicial) -->
        <section id="detalles" class="seccion-detalles efecto-blur">
            <!-- Corregida la duplicación del atributo class -->
            <div class="tarjeta-fondo-cuadros d-flex flex-column align-items-center justify-content-center w-100 clipped-triangle-back">
                <div class="tarjeta-blanca">
                    <!-- Moño decorativo (etiqueta img corregida) -->
                    <img src="monio.png" alt="Moño decorativo" class="decoracion-mono">
                    
                    <div class="tarjeta-cabecera">
                        <h2 class="texto-pequeno-rosa">Acompañanos a celebrar la dulce espera </h2>
                        <h2 class="texto-pequeno-rosa">de</h2>
                        <div class="texto-cursiva-lineas">
                            <span>Elena Amelie <br> Ramos Linares</span>
                        </div>
                        <p class="texto-gris-serif">"Todo tiene su tiempo y todo lo que se quiere debajo del cielo tiene su hora"<br>Eclesiastés 3:1</p>
                    </div>

                    <div class="tarjeta-cuerpo">
                        <!-- Contenedor para la imagen del patito -->
                        <div class="contenedor-imagen">
                            <img src="pato.png" alt="Patito amarillo con flor" class="imagen-patito">
                        </div>
                        
                        <!-- Detalles de fecha y lugar -->
                        <div class="contenedor-info">
                            <div class="info-fecha">
                                <!-- Fecha actualizada -->
                                <span class="mes-dia">Domingo 8 de noviembre</span><br>
                                <span class="hora">3:00 PM</span>
                            </div>
                            <hr class="linea-separadora">
                            <div class="info-lugar d-flex flex-row justify-content-center align-items-center gap-3">
                                <span class="text-start" style="line-height: 1.2;">Salón Balam <br>Restaurante Saqlew</span>
                                
                                <a class="button-74 btn-small d-flex align-items-center gap-2" role="button" target="_blank" href="https://www.google.com/maps?q=15.335052490234375,-91.48750305175781&z=17&hl=es">
                                    <!-- SVG Pin de Ubicación -->
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                                    </svg>
                                    Ubicación
                                </a>
                            </div>
                            <div class="info-rsvp">
                                <!-- Nuevo enlace de WhatsApp con el mensaje predeterminado -->
                                <a class="button-74" role="button" target="_blank" href="https://wa.me/50259542940?text=Hola%20%F0%9F%98%8A%20Con%20mucho%20gusto%20confirmo%20mi%20asistencia.%0A%0AMi%20nombre%20es%3A%20%0AAsistiremos%3A%20%20personas.%0A%0AAgradecemos%20mucho%20confirmar%20antes%20del%2020%20de%20octubre.%20%F0%9F%92%95">Confirmar asistencia</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <script src="main.js"></script>
    </body>
</html>
